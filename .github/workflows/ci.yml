name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install ruff==0.17.5
      - run: ruff check backend

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: nexora, POSTGRES_PASSWORD: nexora, POSTGRES_DB: nexora_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nexora" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt "psycopg[binary]"
      - name: Pull sandbox images (so the adversarial sandbox tests really run)
        run: docker pull python:3.12-alpine && docker pull gcc:13
      - name: Tests on SQLite (with coverage)
        run: python -m pytest -q --cov=app --cov-report=term --cov-report=xml
      - name: Migrations apply on Postgres, and the models match them
        run: alembic upgrade head && alembic check
        env: { CODEMIND_DATABASE_URL: "postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test" }
      - name: Tests on Postgres (+ real Redis for the shared limiter)
        run: python -m pytest -q
        env:
          NEXORA_TEST_DB: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test
          NEXORA_TEST_REDIS: redis://localhost:6379/0
      - uses: actions/upload-artifact@v4
        with: { name: coverage-xml, path: backend/coverage.xml, if-no-files-found: ignore }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test extension/test/*.test.mjs

  docs-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements.txt
      - name: docs/API.md must match the code (the generated timestamp line is ignored)
        working-directory: backend
        env: { CODEMIND_DATABASE_URL: "sqlite:///./docs-check.db", PYTHONPATH: . }
        run: |
          alembic upgrade head
          python scripts/gen_docs.py
          git checkout -- ../docs/historical-backfill-report.md ../docs/pattern-coverage.md ../docs/problem-data-quality-report.md ../docs/sheet-import-registry.md ../docs/platform-capability-matrix.md ../docs/global-problem-source-registry.md  # data-dependent reports are not checked here
          git diff --exit-code --ignore-matching-lines='^_Generated' ../docs/API.md || { echo "::error::docs/API.md is stale: run 'make docs' and commit"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    needs: [backend-test, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: backend, target: api }
          - { name: executor, context: backend, target: executor }
          - { name: web, context: web, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: "${{ matrix.context }}/Dockerfile", failure-threshold: error }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          load: true
          tags: nexora-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Vulnerability scan (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "nexora-${{ matrix.name }}:ci", severity: CRITICAL, ignore-unfixed: true, exit-code: "1", vuln-type: "os,library" }

  stack-e2e:
    name: full stack (compose) smoke + replica spread
    runs-on: ubuntu-latest
    needs: [backend-test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "EXECUTOR_KEY=$(openssl rand -hex 24)"
            echo "METRICS_TOKEN=$(openssl rand -hex 16)"
            echo "SANDBOX_WORKDIR=/tmp/nexora-work"
          } > .env
          mkdir -p /tmp/nexora-work && chmod 777 /tmp/nexora-work
      - run: docker pull python:3.12-alpine
      - name: Build and start the whole stack (3 API replicas, 2 web, worker, executor, Postgres, Redis, nginx)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through the load balancer
        run: EXPECT_REPLICAS=3 WITH_SANDBOX=1 scripts/smoke.sh http://localhost:8080
      - name: Failure drills (kill a replica, lose Redis, restart Postgres)
        run: scripts/chaos.sh http://localhost:8080
      - if: failure()
        run: docker compose ps -a && docker compose logs --tail=80
      - if: always()
        run: docker compose down -v
