name: CodeQL
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "17 3 * * 1" }]
permissions: { contents: read, security-events: write, actions: read }
jobs:
  analyze:
    # Code scanning is free on public repositories; on private ones it needs GitHub Code Security. Skipped (not failed) until one of those is true.
    if: github.event.repository.private == false || vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { language: [python, javascript-typescript] } }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@v3
