name: Bug report
description: Something is broken or wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What you did, what you expected, what you got." }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: "Where (local dev / docker compose / deployed) and commit or tag" }
  - type: textarea
    id: logs
    attributes: { label: Logs or screenshots, description: "Remove secrets and personal data first." }
