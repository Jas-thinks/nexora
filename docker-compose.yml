# Nexora — distributed stack.   docker compose up --build        (then open http://localhost:8080)
#
#   client ─► lb (nginx) ─┬─► web  x2 ──(SSR)
#                         └─► api  x3 ──► redis   (shared rate limits · read cache · scheduler leader lease)
#                                    ├──► db      (Postgres 16 + pgvector)
#                                    └──► executor ─► Docker daemon   (the ONLY service with Docker access; on its own network)
#   worker x1 ──► db, redis                          migrate (one-shot) runs Alembic before api/worker start
#   --profile observability: prometheus + grafana.   Scale any tier:  docker compose up -d --scale api=5 --scale worker=2
#
# Secrets come from .env (see .env.example). Single-host reference deployment: docs/DEPLOYMENT.md says what changes on a real cluster.
name: nexora

x-api: &api
  build: { context: ./backend, target: api }
  image: ${IMAGE_REGISTRY:-nexora}/api:${IMAGE_TAG:-local}
  restart: unless-stopped
  environment: &api-env
    CODEMIND_ENV: prod
    CODEMIND_DATABASE_URL: postgresql+psycopg://nexora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/nexora
    CODEMIND_REDIS_URL: redis://redis:6379/0
    CODEMIND_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    CODEMIND_METRICS_TOKEN: ${METRICS_TOKEN:-}
    CODEMIND_CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
    CODEMIND_WORKER_ENABLED: "false"          # background work lives in the `worker` service, not in every API replica
    CODEMIND_EXECUTOR_URL: ${EXECUTOR_URL:-http://executor:9000}      # point at a separate runner host in production
    CODEMIND_EXECUTOR_KEY: ${EXECUTOR_KEY:?set EXECUTOR_KEY in .env}
    CODEMIND_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    CODEMIND_GROQ_API_KEY: ${GROQ_API_KEY:-}
    CODEMIND_OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    CODEMIND_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    CODEMIND_SMTP_HOST: ${SMTP_HOST:-}
    CODEMIND_SMTP_USER: ${SMTP_USER:-}
    CODEMIND_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    CODEMIND_SMTP_FROM: ${SMTP_FROM:-nexora@localhost}
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }

services:
  lb:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    ports: ["${LB_PORT:-8080}:8080"]
    volumes: ["./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api, web]
    networks: [edge, app]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/lb-health"], interval: 10s, timeout: 3s, retries: 5 }

  web:
    build: { context: ./web, args: { NEXT_PUBLIC_API_URL: /api } }
    image: ${IMAGE_REGISTRY:-nexora}/web:${IMAGE_TAG:-local}
    restart: unless-stopped
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    networks: [app]

  api:
    <<: *api
    deploy:
      replicas: ${API_REPLICAS:-3}
      resources: { limits: { memory: 768m } }
    networks: [app, data, sandbox]

  worker:
    <<: *api
    command: ["python", "-m", "app.worker"]
    healthcheck: { disable: true }               # no HTTP port; restart policy handles crashes, SIGTERM drains the current poll
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources: { limits: { memory: 512m } }
    networks: [data]

  migrate:                                        # one-shot: schema is upgraded exactly once, before any replica serves traffic
    build: { context: ./backend, target: api }
    image: ${IMAGE_REGISTRY:-nexora}/api:${IMAGE_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      CODEMIND_DATABASE_URL: postgresql+psycopg://nexora:${POSTGRES_PASSWORD}@db:5432/nexora
    depends_on: { db: { condition: service_healthy } }
    networks: [data]

  executor:
    build: { context: ./backend, target: executor }
    image: ${IMAGE_REGISTRY:-nexora}/executor:${IMAGE_TAG:-local}
    restart: unless-stopped
    user: root                                    # needs the Docker socket; see the warning below
    environment:
      CODEMIND_EXECUTOR_KEY: ${EXECUTOR_KEY:?set EXECUTOR_KEY in .env}
      TMPDIR: ${SANDBOX_WORKDIR:-/srv/nexora-work}                    # sandbox containers are SIBLINGS on the host daemon, so the scratch dir must exist at the SAME path on the host
    # WARNING: the Docker socket is root on the host. Acceptable for a single-box demo; in production run this service on a separate VM
    # with no other workloads (docs/CODE_EXECUTION.md). Untrusted code itself still runs in network-less, read-only, resource-capped containers.
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "${SANDBOX_WORKDIR:-/srv/nexora-work}:${SANDBOX_WORKDIR:-/srv/nexora-work}"]
    networks: [sandbox]

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nexora
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nexora"], interval: 5s, timeout: 3s, retries: 10 }
    networks: [data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache + rate-limit counters + leader lease: all disposable. LRU eviction, no persistence: losing Redis never loses user data.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    networks: [data]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    environment: { METRICS_TOKEN: "${METRICS_TOKEN:-}" }
    entrypoint: ["/bin/sh", "-c", "printf %s \"$$METRICS_TOKEN\" > /tmp/metrics_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=15d"]
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "promdata:/prometheus"]
    networks: [app, monitoring]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes: ["./deploy/grafana/provisioning:/etc/grafana/provisioning:ro", "./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro", "grafanadata:/var/lib/grafana"]
    networks: [monitoring]

networks:
  edge: {}                                        # reachable from outside (only the lb joins it)
  app: {}                                         # lb <-> web/api
  data: { internal: true }                        # db + redis: no route to the internet, no published ports
  sandbox: { internal: true }                     # api <-> executor only
  monitoring: {}
volumes: { pgdata: {}, promdata: {}, grafanadata: {} }
