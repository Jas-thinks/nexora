# Edge / load balancer. Routes  /api/* -> API pool (prefix stripped)   everything else -> web pool.
# Replicas are discovered through Docker DNS and re-resolved every few seconds (`resolve`, nginx >= 1.27.3), so
# `docker compose up --scale api=5` works without touching this file.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on; tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 2m;   # largest legitimate body is a code submission / sheet import

  resolver 127.0.0.11 valid=5s ipv6=off;

  # Real client IP when a trusted proxy (the TLS edge) sits in front. Private ranges only.
  set_real_ip_from 10.0.0.0/8; set_real_ip_from 172.16.0.0/12; set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For; real_ip_recursive on;

  log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
                              '"ms":"$request_time","upstream":"$upstream_addr","upstream_ms":"$upstream_response_time","cache":"$upstream_cache_status"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  gzip on; gzip_comp_level 5; gzip_min_length 512; gzip_proxied any;
  gzip_types application/json text/css application/javascript text/plain image/svg+xml;

  # Coarse protection that costs the app nothing. The API has its own per-user / per-IP limiter (shared through Redis) behind this.
  limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=20r/m;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

  proxy_cache_path /tmp/nx_static levels=1:2 keys_zone=static:10m max_size=256m inactive=1h use_temp_path=off;

  upstream api_pool {
    zone api_pool 64k;
    least_conn;                                   # LLM / sandbox requests are slow: send new work to the replica with the fewest in flight
    server api:8000 resolve max_fails=2 fail_timeout=5s;
    keepalive 32;
  }
  upstream web_pool {
    zone web_pool 64k;
    server web:3000 resolve max_fails=2 fail_timeout=5s;
    keepalive 16;
  }

  map $http_upgrade $conn_upgrade { default upgrade; "" ""; }

  server {
    listen 8080;
    limit_conn conn_per_ip 50;

    # Liveness of the balancer itself (used by the container healthcheck and the TLS edge).
    location = /lb-health { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /api/ {
      limit_req zone=api_rl burst=60 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;   # overwrite (not append): a client cannot spoof its own address
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Request-ID $request_id;
      # A replica that is restarting / failing must not surface as an error: retry idempotent requests on another one. POSTs are NOT retried.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 3s;
      proxy_read_timeout 120s;        # AI mentor + sandbox runs are slow by nature. SSE responses set X-Accel-Buffering: no themselves.
    }

    location ^~ /api/auth/ {            # stricter bucket for credential endpoints (longest prefix wins over /api/)
      limit_req zone=auth_rl burst=15 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 3s;
    }

    # Hashed, immutable build assets: cache at the edge so the Node servers only render pages.
    location /_next/static/ {
      proxy_pass http://web_pool;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_cache static; proxy_cache_valid 200 1h; proxy_cache_lock on;
      add_header X-Cache $upstream_cache_status;
    }

    location / {
      proxy_pass http://web_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $conn_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
