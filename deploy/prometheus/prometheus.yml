global: { scrape_interval: 15s, evaluation_interval: 15s }
scrape_configs:
  - job_name: nexora-api
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /tmp/metrics_token }
    dns_sd_configs:                    # one target per API replica (Docker DNS returns every container behind the service name)
      - { names: [api], type: A, port: 8000, refresh_interval: 10s }
