<style>body{font:14px system-ui;max-width:520px;margin:24px auto;padding:0 16px}label{display:block;margin-top:12px;font-weight:600}input{width:100%;padding:8px;box-sizing:border-box}button{margin-top:16px;padding:8px 14px}small{color:#666}</style>
<h2>Nexora Capture</h2>
<p>Sends the <b>verdict, problem, language and runtime</b> of your own LeetCode submissions to your Nexora account. It never reads or sends your code.</p>
<label for="u">Nexora API URL</label><input id="u" placeholder="http://localhost:18080">
<label for="t">Capture token</label><input id="t" type="password" placeholder="nxc_..."><small>Create one in Nexora &rarr; Settings &rarr; Browser extension. It can only upload submissions.</small>
<button id="s">Save</button> <span id="m"></span>
<script src="options.js"></script>
