# Production overlay:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
# Adds automatic HTTPS (Caddy / Let's Encrypt) in front of the balancer and stops publishing anything else to the host.
# Images are pulled from the registry (IMAGE_REGISTRY / IMAGE_TAG in .env), not built on the server.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env (e.g. nexora.example.com)}" }
    volumes: ["./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: { lb: { condition: service_healthy } }
    networks: [edge, app]
  lb:
    ports: !override ["127.0.0.1:${LB_PORT:-8080}:8080"]   # loopback only (deploy smoke test); the internet reaches the stack through Caddy alone
  grafana:
    ports: !override ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]   # dashboards on localhost only: use an SSH tunnel
  db:
    logging: &log { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  redis: { logging: *log }
  api: { logging: *log }
  web: { logging: *log }
  worker: { logging: *log }
  executor: { logging: *log }
volumes: { caddy_data: {}, caddy_config: {} }
